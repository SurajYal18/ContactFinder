<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Contact Collector & Finder</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.6);
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative overflow-hidden">
  
  <!-- Subtle background glow effects -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-violet-600/15 rounded-full blur-3xl pointer-events-none"></div>
  
  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10 px-4">
    <!-- Brand Logo and Header -->
    <div class="text-center">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 items-center justify-center shadow-xl shadow-indigo-500/25 mb-4">
        <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
        Contact Collector & Finder
      </h1>
      <p class="mt-2 text-xs sm:text-sm text-slate-400">
        Sign in to access Contact Finder and Directory Finder
      </p>
    </div>

    <!-- Login Card -->
    <div class="mt-8 glass-card py-8 px-6 sm:px-10 rounded-2xl shadow-2xl">
      <!-- Error Alert (hidden by default) -->
      <div id="error-alert" class="hidden mb-5 p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-start space-x-2.5">
        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></i>
        <span id="error-message">Invalid username or password.</span>
      </div>

      <!-- Success Alert (hidden by default) -->
      <div id="success-alert" class="hidden mb-5 p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs flex items-start space-x-2.5">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0 mt-0.5"></i>
        <span>Login successful! Redirecting...</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">
            Username
          </label>
          <div class="relative rounded-xl shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input 
              id="username" 
              name="username" 
              type="text" 
              required 
              autocomplete="username"
              placeholder="Enter your username"
              class="block w-full pl-10 pr-3.5 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5">
            Password
          </label>
          <div class="relative rounded-xl shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input 
              id="password" 
              name="password" 
              type="password" 
              required 
              autocomplete="current-password"
              placeholder="••••••••"
              class="block w-full pl-10 pr-10 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
            >
            <!-- Show/Hide Password Toggle -->
            <button 
              type="button" 
              onclick="togglePasswordVisibility()" 
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none transition cursor-pointer"
              tabindex="-1"
            >
              <i id="password-toggle-icon" data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center space-x-2 text-slate-400 select-none cursor-pointer">
            <input 
              id="remember-me" 
              name="remember-me" 
              type="checkbox" 
              checked
              class="w-4 h-4 rounded border-slate-800 bg-slate-950 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer"
            >
            <span>Stay signed in for 7 days</span>
          </label>
        </div>

        <!-- Sign In Button -->
        <div>
          <button 
            type="submit" 
            id="submit-btn"
            class="w-full flex items-center justify-center space-x-2 py-2.5 px-4 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shadow-indigo-600/30 transition active:scale-[0.99] cursor-pointer"
          >
            <i id="btn-icon" data-lucide="log-in" class="w-4 h-4"></i>
            <span id="btn-text">Sign In</span>
          </button>
        </div>
      </form>

      <!-- Bottom Server Status -->
      <div class="mt-6 pt-5 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
        <div class="flex items-center space-x-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400" id="status-dot"></span>
          <span id="status-text">Protected by Authentication</span>
        </div>
        <span class="text-slate-600">v2.0.0</span>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Determine API Base URL
    const storedApi = (localStorage.getItem("backend_api_url") || "").trim();
    const isVercelHost = window.location.hostname.includes("vercel.app");
    const API_BASE = isVercelHost
      ? (storedApi && !storedApi.includes("127.0.0.1") && !storedApi.includes("localhost") ? storedApi : window.location.origin)
      : (storedApi || (window.location.protocol.startsWith("http") ? window.location.origin : "http://127.0.0.1:8000"));

    // Check if already authenticated on page load
    (async function checkExistingAuth() {
      const existingToken = localStorage.getItem("auth_token");
      if (!existingToken) return;

      try {
        const res = await fetch(`${API_BASE}/api/verify-auth`, {
          headers: { "Authorization": `Bearer ${existingToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated) {
            // Already logged in, redirect
            const urlParams = new URLSearchParams(window.location.search);
            const redirectUrl = urlParams.get("redirect") || "/";
            window.location.replace(redirectUrl);
          }
        }
      } catch (err) {
        console.warn("Auth check failed:", err);
      }
    })();

    // Password visibility toggle
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById("password");
      const icon = document.getElementById("password-toggle-icon");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        icon.setAttribute("data-lucide", "eye-off");
      } else {
        passwordInput.type = "password";
        icon.setAttribute("data-lucide", "eye");
      }
      lucide.createIcons();
    }

    // Form submission handler
    async function handleLogin(e) {
      e.preventDefault();

      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const submitBtn = document.getElementById("submit-btn");
      const btnText = document.getElementById("btn-text");
      const btnIcon = document.getElementById("btn-icon");
      const errorAlert = document.getElementById("error-alert");
      const errorMessage = document.getElementById("error-message");
      const successAlert = document.getElementById("success-alert");

      errorAlert.classList.add("hidden");
      successAlert.classList.add("hidden");

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        errorMessage.textContent = "Please enter both username and password.";
        errorAlert.classList.remove("hidden");
        return;
      }

      // Set loading state
      submitBtn.disabled = true;
      submitBtn.classList.add("opacity-75", "cursor-not-allowed");
      btnText.textContent = "Signing In...";
      btnIcon.setAttribute("data-lucide", "loader-2");
      btnIcon.classList.add("animate-spin");
      lucide.createIcons();

      try {
        const response = await fetch(`${API_BASE}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success && data.token) {
          // Store authentication token
          localStorage.setItem("auth_token", data.token);
          localStorage.setItem("auth_user", data.username || username);
          
          successAlert.classList.remove("hidden");

          // Determine redirect URL
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get("redirect") || "/";

          setTimeout(() => {
            window.location.replace(redirectUrl);
          }, 400);
        } else {
          errorMessage.textContent = data.detail || data.message || "Invalid username or password.";
          errorAlert.classList.remove("hidden");
          submitBtn.disabled = false;
          submitBtn.classList.remove("opacity-75", "cursor-not-allowed");
          btnText.textContent = "Sign In";
          btnIcon.setAttribute("data-lucide", "log-in");
          btnIcon.classList.remove("animate-spin");
          lucide.createIcons();
        }
      } catch (err) {
        console.error("Login request error:", err);
        errorMessage.textContent = "Unable to connect to the authentication server. Please check your connection.";
        errorAlert.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.classList.remove("opacity-75", "cursor-not-allowed");
        btnText.textContent = "Sign In";
        btnIcon.setAttribute("data-lucide", "log-in");
        btnIcon.classList.remove("animate-spin");
        lucide.createIcons();
      }
    }
  </script>
</body>
</html>
